# Teaching materials — upload files to assets/materials/ and reference them here.
#
# How to add a material:
#   1. Place your PDF, slides (.pptx/.pdf), notes, or code in assets/materials/
#   2. Add an entry below with title, course, type, and file path
#   3. Set placeholder: false when the file is ready to publish
#
# Supported types: slides, notes, assignment, lab, video, syllabus, code, other

- id: "example-material"
  title: "[Add Material Title]"
  course: "[Course Name — Institution]"
  type: "slides"
  file: ""
  description: >-
    Copy this entry to add new materials. Use file for uploaded assets
    or url for external hosting. Set placeholder: false when ready.
  semester: "[Semester Year]"
  placeholder: true
