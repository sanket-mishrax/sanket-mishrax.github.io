<div class="institute-timeline">
{% for inst in site.data.institutes %}
  <div class="timeline-item {% if inst.current %}timeline-item--current{% endif %}">
    <div class="timeline-marker"></div>
    <div class="timeline-content">
      <h3>{{ inst.name }}</h3>
      {% if inst.parent %}<p class="inst-parent">{{ inst.parent }}</p>{% endif %}
      <p class="inst-role"><strong>{{ inst.role }}</strong></p>
      <p class="inst-meta">
        <i class="fas fa-map-marker-alt"></i> {{ inst.location }} &nbsp;·&nbsp;
        <i class="fas fa-calendar"></i> {{ inst.period }}
        {% if inst.current %}<span class="badge badge--current">Current</span>{% endif %}
      </p>
      <p>{{ inst.description }}</p>
      {% if inst.website %}
      <p><a href="{{ inst.website }}" target="_blank" rel="noopener">Visit website <i class="fas fa-external-link-alt"></i></a></p>
      {% endif %}
    </div>
  </div>
{% endfor %}
</div>
